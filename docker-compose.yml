services:
  migrate:
    build:
      context: .
      dockerfile: packages/rag-engine/Dockerfile
    command: sh -c "cd packages/rag-engine && alembic upgrade head"
    environment:
      # Migrations run as the Postgres superuser, not app_user: creating
      # roles, granting privileges, and enabling RLS all require elevated
      # privileges app_user deliberately doesn't have.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: packages/rag-engine/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HF_TOKEN: ${HF_TOKEN}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    volumes:
      # Read-only socket mount: this service spins up throwaway sandbox
      # containers (agent_mesh.sandbox.runner) and destroys them immediately.
      # It never needs to do anything else with the socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persists downloaded HF model weights (Prompt Guard, etc.) across
      # container rebuilds. Without this, every rebuild starts with an
      # empty cache and re-downloads the same ~86M-parameter model from
      # scratch, turning routine local iteration into a repeated network
      # download for no reason.
      - hf-cache:/home/appuser/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_change_me}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.19.1
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./infra/opa/policies:/policies
    ports:
      - "8181:8181"
    restart: unless-stopped

volumes:
  pgdata:
  hf-cache: