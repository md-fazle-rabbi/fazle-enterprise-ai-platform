<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fazle Enterprise AI Platform social preview</title>
    <!--
      Source for social-preview.png, 1280x640, the size GitHub uses for repository social
      previews. Render it with render-social-preview.mjs from the apps/web folder. The Geist
      font files come from apps/web/node_modules, so run `npm ci` there first. The four numbers
      are copied from the README "At a glance" table, like the ones on the landing page.
    -->
    <style>
      @font-face {
        font-family: "Geist Local";
        src: url("../../apps/web/node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono Local";
        src: url("../../apps/web/node_modules/geist/dist/fonts/geist-mono/GeistMono-Variable.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        padding: 64px 72px;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: "Geist Local", system-ui, sans-serif;
      }
      body::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 10px;
        background: #4f46e5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 28px;
        font-weight: 600;
      }
      h1 {
        max-width: 1000px;
        font-size: 76px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      .sub {
        max-width: 920px;
        margin-top: 24px;
        color: #d4d4d4;
        font-size: 30px;
        line-height: 1.35;
      }
      .stats {
        display: flex;
        gap: 16px;
      }
      .stat {
        border: 1px solid #404040;
        border-radius: 14px;
        padding: 16px 22px;
      }
      .stat b {
        display: block;
        font-family: "Geist Mono Local", ui-monospace, monospace;
        font-size: 28px;
        font-weight: 600;
      }
      .stat span {
        color: #a3a3a3;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#4f46e5" />
        <path
          d="M16 6 L24 9 V15.5 C24 20.2 20.6 24 16 26 C11.4 24 8 20.2 8 15.5 V9 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.2"
          stroke-linejoin="round"
        />
        <path
          d="M12.3 15.8 L15 18.5 L20 13"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Fazle Enterprise AI Platform
    </div>
    <div>
      <h1>Enterprise RAG built to survive a security review</h1>
      <p class="sub">
        Tenant isolation in the database, cited answers, a kill switch and a governance layer.
      </p>
    </div>
    <div class="stats">
      <div class="stat"><b>Row Level Security</b><span>Tenant isolation</span></div>
      <div class="stat"><b>100% RAGAS</b><span>Measured locally</span></div>
      <div class="stat"><b>p95 1900 ms</b><span>Single user</span></div>
      <div class="stat"><b>Under 5 s</b><span>Kill switch</span></div>
    </div>
  </body>
</html>
