[project]
name = "governance"
version = "0.1.0"
description = "EU AI Act classification, SOC2-aligned audit logging, compliance documentation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "google-genai>=2.20.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governance"]
