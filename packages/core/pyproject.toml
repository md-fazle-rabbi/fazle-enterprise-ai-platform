[project]
name = "core"
version = "0.1.0"
description = "Shared Pydantic v2 settings for fazle-enterprise-ai-platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-genai>=2.20.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50",
    "opentelemetry-instrumentation-sqlalchemy>=0.50",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
include = ["src/core/py.typed"]
