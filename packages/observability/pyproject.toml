[project]
name = "observability"
version = "0.1.0"
description = "Load testing and drift-detection scripts against the running platform. Tracing, alerting, quota, and semantic caching live in core/rag-engine directly, see the note in this package's README for why."
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "rag-engine",
    "evidently>=0.7.21",
    "pandas>=2.2",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50",
    "opentelemetry-instrumentation-sqlalchemy>=0.50",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[dependency-groups]
dev = [
    "locust>=2.32",
]    

[tool.uv.sources]
core = { workspace = true }
rag-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]
include = ["src/observability/py.typed"]