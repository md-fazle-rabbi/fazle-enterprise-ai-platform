[project]
name = "rag-engine"
version = "0.1.0"
description = "RAG ingestion, retrieval, and hallucination-defense service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]
