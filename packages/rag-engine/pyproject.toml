[project]
name = "rag-engine"
version = "0.1.0"
description = "RAG ingestion, retrieval, and hallucination-defense service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "agent-mesh",
    "observability",
    "governance",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "tiktoken>=0.8",
    "pgvector>=0.3.6",
    "voyageai>=0.3",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "transformers>=4.46",
    "torch>=2.5",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "pymupdf>=1.25",
    "python-multipart>=0.0.32",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8",
    "redis>=5.2",
    "pyjwt>=2.10",
    "cryptography>=44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "ragas>=0.2",
    "langchain-community>=0.3,<0.4",   # pin: langchain-community 0.4.x deleted chat_models/vertexai.py, ragas still imports it unconditionally (upstream unfixed as of ragas main)
    "langchain-google-vertexai>=2.0",
    "langchain-google-genai>=2.0",
    "datasets>=3.0",
    "asgi-lifespan>=2.1.0",
]

[tool.uv.sources]
core = { workspace = true }
agent-mesh = { workspace = true }
observability = { workspace = true }
governance = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "datasets"
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["asyncio: marks tests as asyncio"]
asyncio_mode = "auto"
filterwarnings = [
    # Traced to source, not guessed: HF's modeling_deberta_v2.py decorates
    # c2p_dynamic_expand/p2c_dynamic_expand/pos_dynamic_expand with
    # @torch.jit.script at module-import time (mDeBERTa-v3 is Prompt
    # Guard 2's base architecture). Confirmed still present as of
    # huggingface/transformers#44916 (Sep 2026), which only moved a
    # comment to fix Python 3.13 parsing — the decorator itself stays.
    # No call site in our code triggers this; nothing here to fix upstream
    # of an HF release. Scoped to that exact message + emitting module so
    # it doesn't mask any other warning, including future ones in our own
    # code.
    "ignore:`torch\\.jit\\.script` is deprecated.*:DeprecationWarning:torch\\.jit\\._script",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]
