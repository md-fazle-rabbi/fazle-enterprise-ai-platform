[project]
name = "agent-mesh"
version = "0.1.0"
description = "LangGraph-based agent orchestration, MCP tools, signed inter-agent messaging"
requires-python = ">=3.13,<3.14"
dependencies = [
    "core",
    "langchain>=1.0",
    "langchain-google-genai>=2.1",
    "httpx>=0.28",
    "mcp>=2.2.0",
    "fastmcp>=4.0.3",
    "redis>=5.2",
    "cryptography>=44.0",
    "pyjwt>=2.10",
    "docker>=7.1",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mesh"]
