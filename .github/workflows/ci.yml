name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13.15
      - name: Install dependencies
        run: uv sync --all-packages
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy --strict -p core -p rag_engine -p agent_mesh

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: fazle
          POSTGRES_PASSWORD: fazle_ci_password
          POSTGRES_DB: fazle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fazle -d fazle"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://fazle:fazle_ci_password@localhost:5432/fazle
      REDIS_URL: redis://localhost:6379/0
      APP_DATABASE_URL: postgresql+asyncpg://app_user:ci_app_password@localhost:5432/fazle
      APP_DB_PASSWORD: ci_app_password
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13.15
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run migrations
        working-directory: packages/rag-engine
        run: uv run alembic upgrade head
      - name: pytest, coverage gate on chunking only
        working-directory: packages/rag-engine
        run: |
          uv run pytest \
            --cov=rag_engine.chunking \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report
          path: packages/rag-engine/coverage.xml
      - name: Pull sandbox runner image
        # agent_mesh.sandbox.runner spins up throwaway containers from this
        # image via docker-py's low-level create_container API, which does
        # NOT auto-pull on a cache miss the way `docker run` does. On a
        # fresh runner (no local image cache), create() 404s immediately
        # unless the image is already present. Pulling explicitly here
        # keeps that behavior visible and out of test runtime/timeouts.
        # TODO: pin by digest (python@sha256:...) instead of a mutable tag
        # once this repo starts caring about supply-chain reproducibility
        # end-to-end; tracked as a follow-up, not blocking here.
        run: docker pull python:3.13.15-slim
      - name: agent-mesh tests
        working-directory: packages/agent-mesh
        # test_authz.py excluded: needs a live OPA instance. GitHub Actions'
        # `services:` containers can't bind-mount infra/opa/policies (no
        # volume support in that block, and the repo isn't checked out yet
        # when services start regardless), so wiring OPA into this job needs
        # a manual `docker run` step after checkout, not a services entry.
        # Tracked separately, not silently skipped without a reason here.
        run: uv run pytest --ignore=tests/test_authz.py -v

  web-checks:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      # Why: exercises the real-Redis integration tests too (micro-step 5's store,
      # micro-step 6's login transactions), not just the ones with a fake Redis. Database
      # 15 only, per those tests' own guard.
      REDIS_TEST_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        # TODO: verify this SHA before relying on it. Two independent sources disagreed on
        # the current v6.x.y pin when this was written; resolve it yourself with:
        # git ls-remote --tags https://github.com/actions/setup-node | grep -E 'refs/tags/v6\.[0-9]+\.[0-9]+$' | sort -V | tail -1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Prettier format check
        run: npm run format:check
      - name: Vitest, with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: web-coverage-report
          path: apps/web/coverage/

  web-build-and-scan:
    runs-on: ubuntu-latest
    needs: web-checks
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -f apps/web/Dockerfile -t fazle-web:${{ github.sha }} ./apps/web
      - name: Smoke test — image boots and serves /api/health
        run: |
          docker run -d --name web-smoke -p 3000:3000 \
            -e KEYCLOAK_WEB_CLIENT_SECRET=ci-smoke-test-placeholder-value \
            fazle-web:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health
          docker stop web-smoke
      - name: Trivy scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: fazle-web:${{ github.sha }}
          format: sarif
          output: trivy-web-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-web-results.sarif

  security:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: pip-audit
        run: |
          uv export --format requirements-txt --no-hashes > requirements.txt
          uvx pip-audit -r requirements.txt || true
        # non-blocking for now: findings get triaged on the first real run,
        # tighten to a hard fail once that first pass is reviewed by hand
      - name: CodeQL init
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1

  build-and-scan:
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -f packages/rag-engine/Dockerfile -t rag-engine:${{ github.sha }} .
      - name: Smoke test — image boots and imports cleanly
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://x:x@localhost:5432/x \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e VOYAGE_API_KEY=dummy \
            rag-engine:${{ github.sha }} \
            python -c "import rag_engine.main"
      - name: Trivy scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rag-engine:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-results.sarif

  ragas-gate:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: fazle
          POSTGRES_PASSWORD: fazle_ci_password
          POSTGRES_DB: fazle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fazle -d fazle"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://fazle:fazle_ci_password@localhost:5432/fazle
      REDIS_URL: redis://localhost:6379/0
      APP_DATABASE_URL: postgresql+asyncpg://app_user:ci_app_password@localhost:5432/fazle
      APP_DB_PASSWORD: ci_app_password
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Python
        run: uv python install 3.13.15
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Run migrations
        working-directory: packages/rag-engine
        run: uv run alembic upgrade head
      - name: Run RAGAS gate
        working-directory: packages/rag-engine
        run: uv run python -m evals.run_ragas