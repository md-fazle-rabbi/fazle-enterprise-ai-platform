version: 2

# uv is intentionally not listed. Dependabot's uv job errors on this repo, see ADR-028.
#
# Manual bump checklist (monthly reminder, ADR-028). Dependabot cannot cooldown these:
#   - keycloak/keycloak (quay.io)    (docker-compose.yml)
#   - astral-sh/uv (ghcr.io)         (packages/rag-engine/Dockerfile). Bump together with
#                                    UV_VERSION in .github/workflows/ci.yml.
#   - pgvector/pgvector and the service images in ci.yml (Dependabot does not scan
#     workflow service containers at all).
#
# Dependabot names images without the registry host (keycloak/keycloak, not
# quay.io/keycloak/keycloak), so ignore entries must use that short form or they
# silently match nothing.
#
# Security updates ignore cooldown by design, so the delay below never holds back a CVE fix.

updates:
  # Why: the repo root package.json holds only redis, apps/web holds the real web app.
  # Both lockfiles need watching.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 5
    # Why: a brand new release is the riskiest one (hijacked or malicious versions are
    # usually caught within days). Waiting a few days costs little. Majors wait longer.
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore(deps)"
    # Why: one PR per week instead of one per package keeps the review queue small.
    # Majors stay out of the group so each one gets its own review.
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Why: every action in ci.yml is pinned to a commit SHA. Dependabot is what keeps
  # those pins from going stale. The cooldown matters most here: a bump replaces the SHA
  # of code that runs with the workflow's permissions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/apps/web"
      - "/packages/rag-engine"
    schedule:
      interval: "monthly"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 3
    # Why: Dependabot rejects semver-*-days for the docker ecosystem, only default-days
    # is valid here. Majors of python and node are ignored below anyway.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Why: Python 3.13 is a deliberate choice (ADR-000). Patch bumps are welcome,
      # a move to 3.14 is a manual decision.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Why: a Node major bump has to move .nvmrc and package.json engines with it.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      # Why: ghcr.io gives no publication date, so cooldown cannot apply to the uv image.
      # Updated by hand together with UV_VERSION in ci.yml, see ADR-028. Both name forms
      # are listed because Dependabot drops the registry host from the name.
      - dependency-name: "ghcr.io/astral-sh/uv"
      - dependency-name: "astral-sh/uv"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Dhaka"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Why: a Postgres or pgvector major upgrade needs a data migration, never an
      # automatic PR against a volume that holds real data.
      - dependency-name: "pgvector/pgvector"
      # Why: quay.io gives Dependabot no publication date, so Keycloak, the auth component,
      # would arrive with no cooldown. Updated by hand on a monthly reminder, see ADR-028.
      # The name has no registry host: "quay.io/keycloak/keycloak" matches nothing.
      - dependency-name: "keycloak/keycloak"